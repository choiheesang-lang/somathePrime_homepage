  <!-- 피그마 GNB 세트(18291-11394). 위 28px 유틸 바 + 아래 100px 메뉴 바.
       {{kind}} = gnb2--main(메인, 사진 위 투명 → 호버 · 히어로 아래에서 흰색) | gnb2--sub(서브, 흰 바탕) — tools/build.py gnb().
       홍길동 · 교육기관은 로그인 상태 견본입니다 — 회원 연동 때 실제 값으로 바뀝니다. 유틸 바는 「홍길동 ⌄ 교육기관 ⌄ | 로그아웃」. -->
  <header class="gnb2 {{kind}}" id="site-header">
    <div class="gnb2__top">
      <div class="gnb2__top-in">
        <ul class="gnb2__acct">
          <li class="gnb2__dd">
            <button type="button" class="gnb2__dd-btn" aria-expanded="false" aria-controls="gnb-user">홍길동<span class="gnb2__chev" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor"/></svg></span></button>
            <ul class="gnb2__drop" id="gnb-user">
              <li><a href="/mypage.html">마이페이지</a></li>
              <li><a href="/tuition.html">수강료 납부</a></li>
            </ul>
          </li>
          <li class="gnb2__dd">
            <button type="button" class="gnb2__dd-btn" aria-expanded="false" aria-controls="gnb-org">교육기관<span class="gnb2__chev" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor"/></svg></span></button>
            <ul class="gnb2__drop" id="gnb-org">
              <li><a href="/" aria-current="true">소마 더 프라임 목동</a></li>
            </ul>
          </li>
        </ul>
        <span class="gnb2__vr" aria-hidden="true"></span>
        <a class="gnb2__logout" href="/mypage.html#logout">로그아웃</a>
      </div>
    </div>
    <div class="gnb2__inner">
      <a class="gnb2__brand" href="/" aria-label="소마 더 프라임 홈"><svg class="logo-prime" viewBox="0 0 432 160" aria-hidden="true" focusable="false"><use href="#logo-prime" /></svg><img class="logo-prime-white" src="/svg/logo-prime-white.svg" width="108" height="40" alt="" /></a>
      <nav class="gnb2__nav" aria-label="주요 메뉴">
        <ul class="gnb2__menu">
          {{items}}
        </ul>
      </nav>
      <button type="button" class="gnb2__burger" id="mnav-open" aria-label="전체 메뉴 열기" aria-controls="mnav" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </header>

  <div class="mnav" id="mnav" hidden>
    <div class="mnav__head">
      <a class="gnb2__brand" href="/" aria-label="소마 더 프라임 홈"><svg class="logo-prime" viewBox="0 0 432 160" aria-hidden="true" focusable="false"><use href="#logo-prime" /></svg></a>
      <button type="button" class="mnav__close" id="mnav-close" aria-label="전체 메뉴 닫기"><svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M1 1L17 17M17 1L1 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
    <div class="mnav__acct">
      <a class="mnav__user" href="/mypage.html"><b>홍길동</b> 님 · 소마 더 프라임 목동</a>
    </div>
    <ul class="mnav__list">
        {{mobile}}
    </ul>
    <div class="mnav__util"><a href="/tuition.html">수강료 납부</a><a href="/mypage.html#logout">로그아웃</a></div>
  </div>
